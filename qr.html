<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>QR fotos · XV Luz María</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Jost:wght@400;500&family=Pinyon+Script&display=swap" rel="stylesheet">
  <style>
    /* Tarjeta para imprimir y poner en las mesas (A6 / media hoja) */
    :root { --paper: #FBF7F1; --ink: #2E211A; --soft: #5A4A3F; --camel: #8A5A2E; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #e9e1d6; font-family: "Jost", system-ui, sans-serif; color: var(--ink); display: grid; place-items: center; min-height: 100vh; padding: 16px; }
    .card {
      width: min(100%, 105mm); aspect-ratio: 105 / 148; background: var(--paper);
      border-radius: 6px; padding: 9mm 8mm; text-align: center;
      display: grid; align-content: center; justify-items: center; gap: 4mm;
      box-shadow: 0 10px 30px -10px rgb(0 0 0 / .3); position: relative;
    }
    .card::before { content: ""; position: absolute; inset: 4mm; border: 1px solid rgb(138 90 46 / .4); border-radius: 4px; pointer-events: none; }
    .eyebrow { font-size: 8.5pt; letter-spacing: .3em; text-transform: uppercase; color: var(--camel); font-weight: 500; }
    h1 { margin: 0; font-family: "Pinyon Script", cursive; font-weight: 400; font-size: 34pt; line-height: 1; }
    h2 { margin: 0; font-family: "Cormorant Garamond", serif; font-style: italic; font-weight: 500; font-size: 17pt; }
    #qr { width: 46mm; height: 46mm; }
    #qr svg { width: 100%; height: 100%; display: block; }
    p { margin: 0; font-size: 9.5pt; color: var(--soft); line-height: 1.5; max-width: 70mm; }
    .print { margin-top: 16px; padding: 12px 22px; border: 0; border-radius: 999px; background: var(--ink); color: var(--paper); font: inherit; cursor: pointer; min-height: 48px; }
    .wrap { display: grid; justify-items: center; }
    @media print {
      body { background: none; padding: 0; min-height: 0; }
      .card { box-shadow: none; }
      .print { display: none; }
      @page { size: A6; margin: 0; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <span class="eyebrow">Mis XV</span>
      <h1>Luz María</h1>
      <h2>¡Compartí tus fotos!</h2>
      <div id="qr" role="img" aria-label="Código QR para subir fotos"></div>
      <p>Escaneá el código con la cámara del celular y subí las fotos que saques esta noche.</p>
    </div>
    <button class="print" type="button" onclick="print()">Imprimir</button>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <script>
    // Apunta a la sección de fotos de esta misma web (funciona en cualquier dominio donde la publiques)
    const target = new URL('./#subir', location.href).href;
    const qr = qrcode(0, 'M');
    qr.addData(target);
    qr.make();
    document.getElementById('qr').innerHTML = qr.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
  </script>
</body>
</html>
